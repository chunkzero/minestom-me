name: Build & Test Main

on:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build:
    name: JVM Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: graalvm
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - name: Run JVM Checks
        run: ./gradlew check

  javadoc:
    name: Javadoc Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: graalvm
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - name: Build Javadoc
        run: ./gradlew javadoc

  native-test:
    name: Native Test
    needs: build
    runs-on: ubuntu-latest
    outputs:
      metadata-updated: ${{ steps.native-run.outcome == 'failure' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: graalvm
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - id: native-run
        name: Run Tests in Native Image
        continue-on-error: true
        run: ./gradlew nativeTest
      - name: Run Tracing Agent (Fallback)
        if: steps.native-run.outcome == 'failure'
        run: ./gradlew -Pagent test
      - name: Copy Native Metadata (Fallback)
        if: steps.native-run.outcome == 'failure'
        run: ./gradlew metadataCopy
      - name: Run Tests in Native Image (Fallback)
        if: steps.native-run.outcome == 'failure'
        run: ./gradlew nativeTest

  publish-nightly:
    name: Publish Nightly
    needs: [ build, javadoc, native-test ]
    runs-on: ubuntu-latest
    concurrency:
      group: publish-${{ github.ref }}
    steps:
      - name: Generate Bot Token
        if: needs.native-test.outputs.metadata-updated == 'true'
        id: get-bot-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          token: ${{ needs.native-test.outputs.metadata-updated == 'true' && steps.get-bot-token.outputs.token || github.token }}
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: graalvm
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - id: base
        name: Read Release Version
        run: echo "version=$(sed -n 's/^releaseVersion=//p' gradle.properties)" >> "$GITHUB_OUTPUT"

      - id: version
        name: Determine Nightly Version
        uses: chunkzero/release-tools/version@v1
        with:
          base: ${{ steps.base.outputs.version }}
          channel: nightly

      - name: Run Tracing Agent
        if: needs.native-test.outputs.metadata-updated == 'true'
        run: ./gradlew -Pagent test

      - name: Copy Reachability Metadata
        if: needs.native-test.outputs.metadata-updated == 'true'
        run: ./gradlew metadataCopy

      # The metadata commit triggers its own run, which publishes it. This run then skips publishing,
      # so every nightly contains exactly the commit named in its version.
      - id: metadata
        name: Commit and Push Updated Metadata
        if: needs.native-test.outputs.metadata-updated == 'true'
        run: |
          git config --global user.name "minestom-ci[bot]"
          git config --global user.email "294309606+minestom-ci[bot]@users.noreply.github.com"
          git add src/main/resources/META-INF/native-image
          if ! git diff --cached --quiet; then
            git commit -m "chore: update GraalVM reachability metadata"
            git push origin master
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Metadata is already up-to-date."
          fi

      - id: check
        name: Check Published Version
        env:
          VERSION: ${{ steps.version.outputs.version }}
          METADATA_PUSHED: ${{ steps.metadata.outputs.pushed == 'true' }}
        run: |
          if [ "$METADATA_PUSHED" = true ]; then
            echo "Skipped ${VERSION}: the reachability metadata commit publishes its own nightly." >> "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          URL="https://maven.chunkzero.com/nightlies/com/chunkzero/multistom/multistom/${VERSION}/multistom-${VERSION}.pom"
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' "$URL")
          case "$STATUS" in
            200)
              echo "Version: ${VERSION} (already published)" >> "$GITHUB_STEP_SUMMARY"
              echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            404) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Unexpected HTTP ${STATUS} from ${URL}"; exit 1 ;;
          esac

      - name: Setup Maven R2
        if: steps.check.outputs.publish == 'true'
        uses: chunkzero/maven-r2@v1
        with:
          version: v0.1.0

      - name: Publish Nightly
        if: steps.check.outputs.publish == 'true' && github.repository == 'chunkzero/multistom'
        env:
          MINESTOM_VERSION: ${{ steps.version.outputs.version }}
          MAVEN_R2_SERVER: https://maven.chunkzero.com
          MAVEN_R2_TOKEN: ${{ secrets.MAVEN_R2_TOKEN }}
        run: |
          : "${MAVEN_R2_TOKEN:?Set the Maven R2 publishing token secret}"
          maven-r2 publish --repository default/nightlies -- ./gradlew :publishAllPublicationsToMavenR2Repository :testing:publishAllPublicationsToMavenR2Repository
          echo "Version: ${MINESTOM_VERSION}" >> "$GITHUB_STEP_SUMMARY"
