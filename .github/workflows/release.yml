name: Release
# Releases releaseVersion from gradle.properties. Afterwards, bump it to the next upcoming version.
on:
  workflow_dispatch: { }
permissions:
  contents: write # Required to create tags
jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: publish-release
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with: # Fetch tags to check whether this version is already tagged
          fetch-depth: 0

      - id: base
        name: Read Release Version
        run: echo "version=$(sed -n 's/^releaseVersion=//p' gradle.properties)" >> "$GITHUB_OUTPUT"

      - id: version
        name: Determine Version
        uses: chunkzero/release-tools/version@v1
        with:
          base: ${{ steps.base.outputs.version }}
          channel: release

      # Tagging before publishing ties the version to this commit, so a failed run can only be resumed from it.
      - name: Reserve Tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          COMMIT=$(git rev-parse -q --verify "refs/tags/${TAG}^{commit}" || true)
          if [ -z "$COMMIT" ]; then
            git tag "$TAG"
            git push origin "$TAG"
          elif [ "$COMMIT" != "$GITHUB_SHA" ]; then
            echo "::error::${TAG} already exists on ${COMMIT}. Bump releaseVersion in gradle.properties."
            exit 1
          fi
          echo "Version: ${TAG#v}" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: graalvm
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Tracing Agent # There is a slight race that we have to solve by rerunning
        run: ./gradlew -Pagent test

      - name: Copy Reachability Metadata
        run: ./gradlew metadataCopy

      - name: Verify Metadata
        run: |
          if ! git diff --quiet src/main/resources/META-INF/native-image; then
            echo "Reachability metadata generated during the release build does not match the committed files in the repository."
          else
            echo "Reachability metadata is fully synchronized."
          fi

      - name: Build javadoc
        run: ./gradlew javadoc
        env:
          MINESTOM_VERSION: ${{ steps.version.outputs.version }}

      - id: check
        name: Check Published Version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          URL="https://maven.chunkzero.com/com/chunkzero/multistom/multistom/${VERSION}/multistom-${VERSION}.pom"
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' "$URL")
          case "$STATUS" in
            200) echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            404) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Unexpected HTTP ${STATUS} from ${URL}"; exit 1 ;;
          esac

      - name: Setup Maven R2
        if: steps.check.outputs.publish == 'true'
        uses: chunkzero/maven-r2@v1
        with:
          version: v0.1.0

      - name: Publish to Maven R2
        if: steps.check.outputs.publish == 'true' && github.repository == 'chunkzero/multistom'
        env:
          MINESTOM_VERSION: ${{ steps.version.outputs.version }}
          MAVEN_R2_SERVER: https://maven.chunkzero.com
          MAVEN_R2_TOKEN: ${{ secrets.MAVEN_R2_TOKEN }}
        run: |
          : "${MAVEN_R2_TOKEN:?Set the Maven R2 publishing token secret}"
          maven-r2 publish --repository default/releases -- ./gradlew :publishAllPublicationsToMavenR2Repository :testing:publishAllPublicationsToMavenR2Repository

      - name: Deploy javadoc to its assigned branch
        uses: s0/git-publish-subdir-action@develop
        env:
          REPO: self
          BRANCH: javadoc
          FOLDER: build/docs/javadoc
          SKIP_EMPTY_COMMITS: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLEAR_GLOBS_FILE: ".github/javadoc-publish-clear"

      - name: Create GitHub Release
        if: steps.version.outputs.published != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          make_latest: ${{ !contains(steps.version.outputs.version, '-') }}
          generate_release_notes: true
